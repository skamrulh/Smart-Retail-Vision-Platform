global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'smart-retail-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'

  # Redis metrics require redis-exporter sidecar (not the Redis port itself)
  # Uncomment and add redis-exporter to docker-compose to enable:
  # - job_name: 'redis-exporter'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
